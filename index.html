<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bodymatch - Discover Your Glow</title>

  <!-- Space Grotesk font -->
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: 'Space Grotesk', sans-serif;
      background-color: #000;
      color: #fff;
      display: flex;
      flex-direction: column;
      opacity: 0;
      animation: fadeIn 0.8s ease forwards;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    /* Top Brand Bar - Always visible */
    .brand-bar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 20px 30px;
      z-index: 100;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: all 0.3s ease;
    }

    .brand-name {
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #fff;
      text-decoration: none;
      position: relative;
      padding: 5px 0;
    }

    .brand-name::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 1px;
      background: linear-gradient(90deg, #fff, #aaa);
      transition: width 0.3s ease;
    }

    .brand-name:hover::after {
      width: 100%;
    }

    /* Hero: full-viewport background video + CTA */
    .hero {
      position: relative;
      width: 100%;
      height: auto;
      aspect-ratio: 21 / 9;
      overflow: hidden;
      flex-shrink: 0;
      background-color: #000;
      background-image: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 100%);
      background-size: cover;
      background-position: center;
      padding-top: 80px; /* Space for fixed brand bar */
      cursor: none; /* Remove cursor from video area */
    }

    .hero video {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100%;
      height: 100%;
      transform: translate(-50%, -50%);
      object-fit: cover;
      opacity: 0;
      transition: opacity 1s ease;
      z-index: 1;
      pointer-events: none; /* Prevent any interaction with video */
    }

    .hero video.loaded {
      opacity: 1;
    }

    /* Video overlay for better contrast */
    .video-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.3);
      z-index: 2;
      pointer-events: none;
    }

    /* CTA button at lower center - HIDDEN by default */
    .cta-button-wrapper {
      position: absolute;
      left: 50%;
      bottom: 15%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 4;
      padding: 0 20px;
      width: 100%;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    .cta-button-wrapper.show {
      opacity: 1;
      visibility: visible;
    }

    .cta-button {
      text-decoration: none;
      background-color: #000;
      color: #fff;
      padding: 18px 46px;
      font-size: 1.3rem;
      border-radius: 4px;
      transition: all 0.3s ease;
      border: 1px solid #fff;
      cursor: pointer;
      display: inline-block;
      font-weight: 600;
      letter-spacing: 0.5px;
      white-space: nowrap;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      position: relative;
      overflow: hidden;
      transform: translateY(20px);
      transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .cta-button-wrapper.show .cta-button {
      transform: translateY(0);
    }

    .cta-button::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transition: left 0.7s ease;
    }

    .cta-button:hover {
      background-color: #fff;
      color: #000;
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
    }

    .cta-button:hover::before {
      left: 100%;
    }

    /* Fallback content */
    .fallback-content {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 3;
      width: 90%;
      max-width: 600px;
      padding: 40px 20px;
      opacity: 0;
      transition: opacity 0.5s ease;
      pointer-events: none; /* Prevent interaction when video is playing */
    }

    .fallback-content.show {
      opacity: 1;
      pointer-events: auto; /* Allow interaction when video fails */
    }

    .fallback-title {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 20px;
      background: linear-gradient(45deg, #fff, #aaa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 0.1em;
    }

    .fallback-subtitle {
      font-size: 1.2rem;
      opacity: 0.8;
      margin-bottom: 40px;
      line-height: 1.6;
    }

    /* Video ended overlay */
    .video-ended-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(to bottom, rgba(0,0,0,0.1), rgba(0,0,0,0.3));
      z-index: 2;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .video-ended-overlay.show {
      opacity: 1;
    }

    /* On tall screens, let it behave like full viewport height */
    @media (max-aspect-ratio: 21/9) {
      .hero {
        height: 100vh;
        aspect-ratio: auto;
      }
    }

    /* Footer wrapper so it sits below hero */
    .page-footer-wrapper {
      flex-shrink: 0;
      background-color: #111;
      margin-top: auto;
    }

    /* Footer styles */
    .footer {
      background-color: #111;
      color: #fff;
      padding: 24px 20px 28px;
      text-align: center;
      font-family: 'Space Grotesk', sans-serif;
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.6s ease-out, transform 0.6s ease-out;
    }

    .footer.show {
      opacity: 1;
      transform: translateY(0);
    }

    .footer-content {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 8px;
    }

    .footer-left {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .footer-text {
      font-size: 1rem;
      font-weight: 400;
    }

    .footer-name {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .footer .heart {
      color: #e25555;
      font-size: 1.2rem;
    }

    .social-links {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 6px;
    }

    .icon {
      width: 24px;
      height: 24px;
      transition: transform 0.3s ease;
    }

    .instagram {
      filter: invert(30%) sepia(76%) saturate(750%) hue-rotate(310deg) brightness(90%) contrast(105%);
    }

    .linkedin {
      filter: invert(34%) sepia(64%) saturate(1797%) hue-rotate(182deg) brightness(90%) contrast(95%);
    }

    .youtube {
      filter: invert(18%) sepia(99%) saturate(6400%) hue-rotate(359deg) brightness(95%) contrast(95%);
    }

    .social-links a:hover img {
      transform: scale(1.15);
    }

    /* Tablet and up */
    @media (min-width: 768px) {
      .brand-bar {
        padding: 22px 40px;
      }

      .brand-name {
        font-size: 1.4rem;
        letter-spacing: 0.3em;
      }

      .cta-button {
        font-size: 1.4rem;
        padding: 20px 50px;
      }

      .cta-button-wrapper {
        bottom: 15%;
      }

      .fallback-title {
        font-size: 3.5rem;
      }
      
      .fallback-subtitle {
        font-size: 1.4rem;
      }

      .footer-content {
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
        text-align: left;
      }

      .footer-left {
        align-items: flex-start;
      }

      .footer-name {
        font-size: 1.15rem;
      }
    }

    /* Small screens */
    @media (max-width: 600px) {
      .brand-bar {
        padding: 16px 20px;
      }

      .brand-name {
        font-size: 1.1rem;
        letter-spacing: 0.2em;
      }

      .hero {
        padding-top: 70px; /* Adjusted for smaller brand bar */
      }

      .cta-button-wrapper {
        bottom: 12%;
      }

      .cta-button {
        font-size: 1.1rem;
        padding: 16px 32px;
        white-space: normal;
      }

      .fallback-title {
        font-size: 2rem;
      }
      
      .fallback-subtitle {
        font-size: 1rem;
      }

      .footer-text,
      .footer-name {
        font-size: 0.95rem;
        text-align: center;
      }

      .social-links {
        gap: 16px;
      }

      .icon {
        width: 22px;
        height: 22px;
      }
    }

    /* Very small devices */
    @media (max-width: 380px) {
      .brand-bar {
        padding: 14px 15px;
      }

      .brand-name {
        font-size: 1rem;
        letter-spacing: 0.15em;
      }

      .hero {
        padding-top: 65px;
      }

      .cta-button-wrapper {
        bottom: 10%;
      }

      .cta-button {
        width: 100%;
        max-width: 260px;
      }
    }
  </style>
</head>
<body>
  <!-- Top Brand Bar - Always visible -->
  <header class="brand-bar">
    <a href="#" class="brand-name">BODYMATCH</a>
  </header>

  <!-- Hero with background video and CTA -->
  <section class="hero">
    <!-- Video overlay -->
    <div class="video-overlay"></div>
    <div class="video-ended-overlay" id="videoEndedOverlay"></div>
    
    <!-- Video element - will play only once, NO CONTROLS -->
    <video
      id="heroVideo"
      autoplay
      muted
      playsinline
      preload="auto"
      title="Bodymatch fragrance film"
      disablePictureInPicture
      disableRemotePlayback>
      <!-- Try different video formats and paths -->
      <source src="Bodymatch.mp4" type="video/mp4" />
      <source src="videos/Bodymatch.mp4" type="video/mp4" />
      <source src="assets/videos/Bodymatch.mp4" type="video/mp4" />
      Your browser does not support the video tag.
    </video>

    <!-- CTA button - HIDDEN until video finishes -->
    <div class="cta-button-wrapper" id="ctaButtonWrapper">
      <a href="https://chat.whatsapp.com/EawwEaGrqvx5t3P5GQUb7E?mode=ac_t" class="cta-button" target="_blank">
        Discover Your Glow
      </a>
    </div>

    <!-- Fallback content (shown only if video fails to load) -->
    <div class="fallback-content" id="fallbackContent">
      <h1 class="fallback-title">BODYMATCH</h1>
      <p class="fallback-subtitle">Discover your signature glow through personalized fragrance matching</p>
      <div style="margin-top: 40px;">
        <a href="https://chat.whatsapp.com/EawwEaGrqvx5t3P5GQUb7E?mode=ac_t" class="cta-button" target="_blank">
          Discover Your Glow
        </a>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <div class="page-footer-wrapper">
    <footer class="footer">
      <div class="footer-content">
        <div class="footer-left">
          <p class="footer-text">Made with <span class="heart">♡</span> by Fashion Designer Dee</p>
          <p class="footer-name">Deekshana Reddy</p>
        </div>
        <div class="social-links">
          <a href="https://www.instagram.com/fashiondesignerdee/" target="_blank" aria-label="Instagram" title="Instagram">
            <img src="https://cdn.jsdelivr.net/npm/simple-icons@v5/icons/instagram.svg" alt="Instagram" class="icon instagram" />
          </a>
          <a href="https://www.linkedin.com/in/deekshana-reddy-%F0%9F%94%B1-966b461a4/" target="_blank" aria-label="LinkedIn" title="LinkedIn">
            <img src="https://cdn.jsdelivr.net/npm/simple-icons@v5/icons/linkedin.svg" alt="LinkedIn" class="icon linkedin" />
          </a>
          <a href="https://www.youtube.com/@Deekshanareddy" target="_blank" aria-label="YouTube" title="YouTube">
            <img src="https://cdn.jsdelivr.net/npm/simple-icons@v5/icons/youtube.svg" alt="YouTube" class="icon youtube" />
          </a>
        </div>
      </div>
    </footer>
  </div>

  <script>
    // Get DOM elements
    const video = document.getElementById('heroVideo');
    const ctaButtonWrapper = document.getElementById('ctaButtonWrapper');
    const fallbackContent = document.getElementById('fallbackContent');
    const videoEndedOverlay = document.getElementById('videoEndedOverlay');
    const brandName = document.querySelector('.brand-name');
    
    // Video sources to try
    const videoSources = [
      'Bodymatch.mp4',
      'videos/Bodymatch.mp4',
      'assets/videos/Bodymatch.mp4'
    ];
    
    let currentSourceIndex = 0;
    let videoHasEnded = false;
    let videoLoadedSuccessfully = false;

    // Function to show the CTA button with animation
    function showCTAButton() {
      ctaButtonWrapper.classList.add('show');
      videoEndedOverlay.classList.add('show');
    }

    // Function to try next video source
    function tryNextVideoSource() {
      if (currentSourceIndex < videoSources.length) {
        const source = videoSources[currentSourceIndex];
        console.log('Trying video source:', source);
        
        // Clear existing sources
        video.querySelectorAll('source').forEach(el => el.remove());
        
        // Add new source
        const newSource = document.createElement('source');
        newSource.src = source;
        newSource.type = 'video/mp4';
        video.appendChild(newSource);
        
        // Load the new source
        video.load();
        currentSourceIndex++;
        
        // Force play the video
        const playVideo = () => {
          const playPromise = video.play();
          if (playPromise !== undefined) {
            playPromise
              .then(() => {
                console.log('Video playing successfully');
                videoLoadedSuccessfully = true;
                // Remove any context menu or controls
                video.removeAttribute('controls');
                video.removeAttribute('controlslist');
              })
              .catch((error) => {
                console.log('Play failed, trying next source:', error);
                setTimeout(tryNextVideoSource, 500);
              });
          }
        };
        
        setTimeout(playVideo, 100);
      } else {
        // All sources failed, show fallback content
        console.log('All video sources failed');
        videoLoadedSuccessfully = false;
        fallbackContent.classList.add('show');
        // Show CTA immediately in fallback mode
        showCTAButton();
      }
    }

    // PREVENT ANY USER INTERACTION WITH VIDEO
    // Disable right-click context menu on video
    video.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      return false;
    });

    // Disable any click/touch interaction with video
    video.addEventListener('click', (e) => {
      e.preventDefault();
      e.stopPropagation();
    });

    video.addEventListener('touchstart', (e) => {
      e.preventDefault();
      e.stopPropagation();
    });

    // Prevent keyboard controls
    video.addEventListener('keydown', (e) => {
      e.preventDefault();
      e.stopPropagation();
    });

    // Video event handlers
    video.addEventListener('loadeddata', () => {
      console.log('Video loaded successfully');
      video.classList.add('loaded');
      fallbackContent.style.opacity = '0';
      // Ensure no controls are shown
      video.removeAttribute('controls');
      video.removeAttribute('controlslist');
    });

    video.addEventListener('canplay', () => {
      console.log('Video can play');
      video.classList.add('loaded');
      videoLoadedSuccessfully = true;
      // Ensure no controls are shown
      video.removeAttribute('controls');
      video.removeAttribute('controlslist');
    });

    video.addEventListener('error', () => {
      console.log('Video error, trying next source');
      setTimeout(tryNextVideoSource, 500);
    });

    // MOST IMPORTANT: When video ends, show CTA button and stay on last frame
    video.addEventListener('ended', () => {
      console.log('Video ended - showing CTA button');
      videoHasEnded = true;
      // Video will automatically pause on last frame
      showCTAButton();
    });

    // Brand name click handler - scroll to top
    brandName.addEventListener('click', (e) => {
      e.preventDefault();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    // Start loading and playing the video
    setTimeout(() => {
      tryNextVideoSource();
    }, 100);

    // Block any attempts to show video controls
    const blockVideoControls = () => {
      video.removeAttribute('controls');
      video.removeAttribute('controlslist');
      // Add controlslist attribute to block download, fullscreen, etc.
      video.setAttribute('controlslist', 'nodownload nofullscreen noremoteplayback');
      video.setAttribute('disablePictureInPicture', '');
      video.setAttribute('disableRemotePlayback', '');
    };

    // Try autoplay on user interaction if blocked
    const attemptPlay = () => {
      if (!videoLoadedSuccessfully && !videoHasEnded) {
        blockVideoControls();
        const playPromise = video.play();
        if (playPromise !== undefined) {
          playPromise.catch(() => {
            console.log("Autoplay prevented");
            // Don't show controls - we want no interaction
            blockVideoControls();
          });
        }
      }
    };

    // Try playing on user interaction
    document.addEventListener('click', attemptPlay, { once: true });
    document.addEventListener('touchstart', attemptPlay, { once: true });

    // Footer animation when it scrolls into view
    window.addEventListener('DOMContentLoaded', () => {
      const footer = document.querySelector('.footer');
      if (!footer) return;

      const observer = new IntersectionObserver(
        ([entry]) => {
          if (entry.isIntersecting) {
            footer.classList.add('show');
            observer.unobserve(footer);
          }
        },
        { threshold: 0.1 }
      );

      observer.observe(footer);
    });

    // Safety: If video takes too long to load, show fallback after 5 seconds
    setTimeout(() => {
      if (!videoLoadedSuccessfully && !videoHasEnded) {
        console.log('Video loading timeout - showing fallback');
        fallbackContent.classList.add('show');
        showCTAButton();
      }
    }, 5000);

    // Periodically ensure no controls appear
    setInterval(blockVideoControls, 1000);
  </script>
</body>
</html>
