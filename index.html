<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0"/>
    <title>Bodymatch | The Experience</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        html, body { height: 100%; background: #000; color: #fff; font-family: 'Space Grotesk', sans-serif; overflow: hidden; touch-action: none; }

        /* --- LOADER --- */
        .loader-wrapper {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: #000; z-index: 9999; transition: opacity 0.8s ease;
        }
        .loader-wrapper.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        .brand-title-loader { font-weight: 700; letter-spacing: 0.4em; text-transform: uppercase; font-size: 1.2rem; margin-bottom: 50px; }
        .loading-bar-wrapper { width: 180px; height: 1px; background: rgba(255,255,255,0.1); margin-bottom: 12px; }
        .loading-bar-fill { width: 0%; height: 100%; background: #fff; transition: width 0.3s ease; }

        /* --- VIDEO ENGINE --- */
        .hero { position: relative; width: 100%; height: 100vh; background: #000; }
        #mainVideo { 
            position: absolute; top: 50%; left: 50%; 
            min-width: 100%; min-height: 100%; width: auto; height: auto; 
            transform: translate(-50%, -50%); 
            object-fit: cover; z-index: 1; 
            transition: opacity 0.8s ease;
        }
        .video-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.25); z-index: 2; pointer-events: none; }

        /* --- NAVIGATION DOTS --- */
        .side-nav {
            position: fixed; right: 30px; top: 50%; transform: translateY(-50%);
            display: flex; flex-direction: column; gap: 15px; z-index: 1000;
        }
        .dot { width: 8px; height: 8px; background: rgba(255, 255, 255, 0.3); border-radius: 50%; transition: 0.4s; cursor: pointer; }
        .dot.active { background: #fff; transform: scale(1.5); box-shadow: 0 0 10px rgba(255, 255, 255, 0.5); }

        /* --- UI ELEMENTS --- */
        .brand-header { position: fixed; top: 0; width: 100%; padding: 25px; display: flex; justify-content: center; z-index: 1000; pointer-events: none;}
        .brand-name { font-size: 1.1rem; font-weight: 700; letter-spacing: 0.3em; text-transform: uppercase; }
        .audio-toggle { position: absolute; top: 100px; right: 25px; width: 44px; height: 44px; background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 1001; backdrop-filter: blur(10px); }
        .audio-toggle svg { width: 18px; height: 18px; fill: #fff; }
        .hidden-icon { display: none; }

        /* --- CTA CONTAINER --- */
        .cta-container {
            position: absolute; left: 50%; bottom: 20%; transform: translateX(-50%);
            z-index: 1001; text-align: center; width: 100%;
            opacity: 0; visibility: hidden; transition: 0.8s ease;
            display: flex; flex-direction: column; align-items: center;
        }
        .cta-container.show { opacity: 1; visibility: visible; }

        .btn {
            display: inline-block; text-decoration: none; background: rgba(255,255,255,0.05); color: #fff;
            padding: 16px 48px; border: 1px solid rgba(255, 255, 255, 0.4); 
            font-weight: 500; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.2em; 
            backdrop-filter: blur(15px); margin-bottom: 25px; transition: 0.4s; cursor: pointer;
        }
        .btn:hover { background: #fff; color: #000; }

        .scroll-hint { font-size: 0.7rem; letter-spacing: 0.5em; text-transform: uppercase; opacity: 0.8; color: #fff; }
        .hint-bounce { display: inline-block; animation: bounce 2s infinite; margin-top: 5px;}
        @keyframes bounce { 0%, 20%, 50%, 80%, 100% {transform: translateY(0);} 40% {transform: translateY(-8px);} }

        /* --- PREMIUM REASONS MODAL --- */
        #reasonsModal {
            position: fixed; inset: 0; background: rgba(0, 0, 0, 0.95); backdrop-filter: blur(30px);
            z-index: 9999; padding: 100px 25px 60px; overflow-y: auto;
            display: none; opacity: 0; transition: opacity 0.5s ease;
        }
        #reasonsModal.active { display: block; opacity: 1; }
        .modal-close { position: fixed; top: 30px; right: 30px; font-size: 2.5rem; cursor: pointer; z-index: 10001; color: rgba(255,255,255,0.6); }
        .modal-title { font-weight: 700; font-size: 1.6rem; margin-bottom: 40px; text-align: center; letter-spacing: 0.05em; max-width: 600px; margin-left: auto; margin-right: auto; }
        
        .reason-item { border-bottom: 1px solid rgba(255,255,255,0.1); padding: 22px 0; max-width: 600px; margin: 0 auto; }
        .reason-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .reason-header h3 { font-size: 0.95rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.1em; text-align: left; }
        .plus-icon { font-size: 1.2rem; transition: transform 0.4s; opacity: 0.5; }
        .reason-content { max-height: 0; overflow: hidden; transition: max-height 0.4s ease; color: rgba(255,255,255,0.7); font-size: 0.9rem; line-height: 1.7; }
        
        .reason-item.open .plus-icon { transform: rotate(45deg); opacity: 1; }
        .reason-item.open .reason-content { max-height: 200px; margin-top: 15px; }

        .modal-footer { margin-top: 60px; text-align: center; max-width: 500px; margin-left: auto; margin-right: auto; }
        .modal-footer p { opacity: 0.6; font-size: 0.9rem; line-height: 1.8; margin-bottom: 30px; }

        @media (max-width: 768px) {
            .cta-container { bottom: 25%; }
            .btn { width: 85%; font-size: 0.8rem; padding: 14px 20px; }
            .modal-title { font-size: 1.3rem; }
        }
    </style>
</head>
<body onclick="unlockBrowser()">

    <div class="loader-wrapper" id="loader">
        <div class="brand-title-loader">BODYMATCH</div>
        <div class="loading-bar-wrapper"><div class="loading-bar-fill" id="loadingFill"></div></div>
        <div id="loadingPercent">0%</div>
    </div>

    <div id="reasonsModal">
        <div class="modal-close" onclick="closeModal()">×</div>
        <h2 class="modal-title">Why You Need a Face Card That Never Declines</h2>
        
        
        
        <div id="accordionContainer"></div>

        <div class="modal-footer">
            <p>Looks aren’t everything—but improving your face can quietly support how you move through life.</p>
            <p style="color: #fff; font-weight: 500;">Join the waitlist and grow with us.</p>
            <a href="https://chat.whatsapp.com/EawwEaGrqvx5t3P5GQUb7E" class="btn" target="_blank" style="margin-top: 20px;">Join the Waitlist</a>
        </div>
    </div>

    <header class="brand-header"><div class="brand-name">BODYMATCH</div></header>

    <div class="side-nav" id="sideNav">
        <div class="dot active" data-index="0"></div>
        <div class="dot" data-index="1"></div>
        <div class="dot" data-index="2"></div>
        <div class="dot" data-index="3"></div>
        <div class="dot" data-index="4"></div>
        <div class="dot" data-index="5"></div>
    </div>

    <section class="hero">
        <div class="video-overlay"></div>
        <button id="audioToggle" class="audio-toggle">
            <svg id="iconMuted" viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73 4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
            <svg id="iconPlaying" class="hidden-icon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
        </button>

        <video id="mainVideo" autoplay muted playsinline preload="auto">
            <source src="Bodymatch.mp4" type="video/mp4">
        </video>

        <div class="cta-container" id="ctaContainer">
            <a id="actionBtn" href="javascript:void(0)" class="btn">Discover Your Glow</a>
            <div class="scroll-hint" id="scrollHint" style="visibility: hidden;">
                Scroll for more <br>
                <span class="hint-bounce">▽</span>
            </div>
        </div>
    </section>

    <script>
        const videoFiles = ["Bodymatch.mp4", "Bodymatchf.mp4", "Bodymatchb.mp4", "Bodymatchh.mp4", "Bodymatchs.mp4", "Bodymatchx.mp4"];
        const WA_LINK = "https://chat.whatsapp.com/EawwEaGrqvx5t3P5GQUb7E";
        
        const reasons = [
            { t: "Powerful first impressions", c: "People often decide how they feel about you in a few seconds." },
            { t: "Feeling confident in social situations", c: "Being comfortable in your own skin makes conversations smoother." },
            { t: "Attracting healthier relationships", c: "People are drawn to those who look like they take care of themselves." },
            { t: "Feeling comfortable being seen", c: "You no longer feel the need to hide your face in public or online." },
            { t: "Liking how you look in photos and videos", c: "You enjoy capturing moments instead of dodging the camera." },
            { t: "Feeling at peace with your reflection", c: "The mirror stops being a source of stress or criticism." },
            { t: "Being perceived as capable and trustworthy", c: "Appearance strongly shapes first judgments of competence." },
            { t: "Being taken seriously in professional settings", c: "A clean, well-presented face supports your skills and hard work." },
            { t: "Quiet, steady self-confidence", c: "You know you look like a better version of yourself, and it shows in how you move through the world." }
        ];

        const video = document.getElementById('mainVideo');
        const loader = document.getElementById('loader'), fill = document.getElementById('loadingFill'), label = document.getElementById('loadingPercent');
        const ctaContainer = document.getElementById('ctaContainer'), actionBtn = document.getElementById('actionBtn'), scrollHint = document.getElementById('scrollHint');
        const dots = document.querySelectorAll('.dot');
        const modal = document.getElementById('reasonsModal');
        const accordion = document.getElementById('accordionContainer');

        reasons.forEach(r => {
            const div = document.createElement('div');
            div.className = 'reason-item';
            div.innerHTML = `<div class="reason-header"><h3>${r.t}</h3><span class="plus-icon">+</span></div><div class="reason-content">${r.c}</div>`;
            div.onclick = () => {
                const isOpen = div.classList.contains('open');
                document.querySelectorAll('.reason-item').forEach(el => el.classList.remove('open'));
                if(!isOpen) div.classList.add('open');
            };
            accordion.appendChild(div);
        });

        let prog = 0;
        let sim = setInterval(() => { if (prog < 98) { prog += 2; fill.style.width = prog + '%'; label.textContent = Math.round(prog) + '%'; } }, 100);
        window.addEventListener('load', () => { clearInterval(sim); fill.style.width = '100%'; label.textContent = '100%'; setTimeout(() => { loader.classList.add('hidden'); video.play().catch(() => {}); }, 600); });

        function unlockBrowser() { if(video.paused) video.play().catch(() => {}); }
        function closeModal() { modal.classList.remove('active'); document.body.style.overflow = 'hidden'; }

        video.onended = () => {
            videoEnded = true;
            ctaContainer.classList.add('show');
            if (currentIdx === 0) {
                actionBtn.textContent = "Discover Your Glow";
                scrollHint.style.visibility = "hidden";
            } else if (currentIdx === 1) {
                actionBtn.textContent = "Learn More";
                scrollHint.style.visibility = "visible";
            } else {
                actionBtn.textContent = "Join the Waitlist";
                scrollHint.style.visibility = "visible";
            }
        };

        actionBtn.onclick = (e) => {
            if (currentIdx === 0) {
                changeVideo('next');
            } else if (currentIdx === 1) {
                modal.classList.add('active');
                document.body.style.overflow = 'auto';
            } else {
                window.open(WA_LINK, '_blank');
            }
        };

        function changeVideo(dir) {
            if (isTransitioning) return;
            if (dir === 'next' && currentIdx === videoFiles.length - 1) return;
            if (dir === 'prev' && currentIdx === 0) return;
            isTransitioning = true; videoEnded = false; ctaContainer.classList.remove('show'); video.style.opacity = '0';
            setTimeout(() => {
                currentIdx = (dir === 'next') ? currentIdx + 1 : currentIdx - 1;
                video.src = videoFiles[currentIdx]; video.load(); video.style.opacity = '1';
                video.play().then(() => { updateDots(currentIdx); isTransitioning = false; }).catch(() => { isTransitioning = false; });
            }, 600);
        }

        function updateDots(index) { dots.forEach(d => d.classList.remove('active')); dots[index].classList.add('active'); }
        window.addEventListener('wheel', (e) => { if (currentIdx > 0 && !modal.classList.contains('active')) { if (e.deltaY > 50) changeVideo('next'); else if (e.deltaY < -50) changeVideo('prev'); } });
        let ts = 0;
        window.addEventListener('touchstart', (e) => ts = e.touches[0].clientY);
        window.addEventListener('touchend', (e) => { if (currentIdx > 0 && !modal.classList.contains('active')) { const te = e.changedTouches[0].clientY; if (ts - te > 70) changeVideo('next'); else if (te - ts > 70) changeVideo('prev'); } });
        scrollHint.onclick = () => changeVideo('next');
        const audioBtn = document.getElementById('audioToggle');
        audioBtn.onclick = (e) => { e.stopPropagation(); video.muted = !video.muted; document.getElementById('iconMuted').classList.toggle('hidden-icon', !video.muted); document.getElementById('iconPlaying').classList.toggle('hidden-icon', video.muted); video.play(); };
    </script>
</body>
</html>
