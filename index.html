<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bodymatch - Discover Your Glow</title>

  <!-- Space Grotesk font -->
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      background: #000;
    }

    body {
      font-family: 'Space Grotesk', sans-serif;
      background-color: #000;
      color: #fff;
      opacity: 0;
      animation: fadeIn 0.8s ease forwards;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    /* Top Brand Bar - Always visible */
    .brand-bar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 20px 30px;
      z-index: 100;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand-name {
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #fff;
      text-decoration: none;
      position: relative;
      padding: 5px 0;
    }

    .brand-name::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 1px;
      background: linear-gradient(90deg, #fff, #aaa);
      transition: width 0.3s ease;
    }

    .brand-name:hover::after {
      width: 100%;
    }

    /* Hero: full-viewport background video + CTA */
    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background-color: #000;
    }

    .hero video {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100%;
      height: 100%;
      transform: translate(-50%, -50%);
      object-fit: cover;
      opacity: 0;
      transition: opacity 1s ease;
      z-index: 1;
    }

    .hero video.loaded {
      opacity: 1;
    }

    /* Video overlay for better contrast */
    .video-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.3);
      z-index: 2;
      pointer-events: none;
    }

    /* CTA button at lower center - HIDDEN by default */
    .cta-button-wrapper {
      position: absolute;
      left: 50%;
      bottom: 15%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 4;
      padding: 0 20px;
      width: 100%;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    .cta-button-wrapper.show {
      opacity: 1;
      visibility: visible;
    }

    .cta-button {
      text-decoration: none;
      background-color: #000;
      color: #fff;
      padding: 18px 46px;
      font-size: 1.3rem;
      border-radius: 4px;
      transition: all 0.3s ease;
      border: 1px solid #fff;
      cursor: pointer;
      display: inline-block;
      font-weight: 600;
      letter-spacing: 0.5px;
      white-space: nowrap;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      position: relative;
      overflow: hidden;
      transform: translateY(20px);
      transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .cta-button-wrapper.show .cta-button {
      transform: translateY(0);
    }

    .cta-button::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transition: left 0.7s ease;
    }

    .cta-button:hover {
      background-color: #fff;
      color: #000;
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
    }

    .cta-button:hover::before {
      left: 100%;
    }

    /* Video ended overlay */
    .video-ended-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(to bottom, rgba(0,0,0,0.1), rgba(0,0,0,0.3));
      z-index: 2;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .video-ended-overlay.show {
      opacity: 1;
    }

    /* Tablet and up */
    @media (min-width: 768px) {
      .brand-bar {
        padding: 22px 40px;
      }

      .brand-name {
        font-size: 1.4rem;
        letter-spacing: 0.3em;
      }

      .cta-button {
        font-size: 1.4rem;
        padding: 20px 50px;
      }

      .cta-button-wrapper {
        bottom: 15%;
      }
    }

    /* Small screens */
    @media (max-width: 600px) {
      .brand-bar {
        padding: 16px 20px;
      }

      .brand-name {
        font-size: 1.1rem;
        letter-spacing: 0.2em;
      }

      .cta-button {
        font-size: 1.1rem;
        padding: 16px 32px;
        white-space: normal;
      }

      .cta-button-wrapper {
        bottom: 12%;
      }
    }

    /* Very small devices */
    @media (max-width: 380px) {
      .brand-bar {
        padding: 14px 15px;
      }

      .brand-name {
        font-size: 1rem;
        letter-spacing: 0.15em;
      }

      .cta-button-wrapper {
        bottom: 10%;
      }

      .cta-button {
        width: 100%;
        max-width: 260px;
      }
    }
  </style>
</head>
<body>
  <!-- Top Brand Bar - Always visible -->
  <header class="brand-bar">
    <a href="#" class="brand-name">BODYMATCH</a>
  </header>

  <!-- Hero with background video and CTA -->
  <section class="hero">
    <!-- Video overlay -->
    <div class="video-overlay"></div>
    <div class="video-ended-overlay" id="videoEndedOverlay"></div>
    
    <!-- Video element - will play only once and stop at end -->
    <video
      id="heroVideo"
      autoplay
      muted
      playsinline
      preload="auto"
      title="Bodymatch fragrance film">
      <!-- Try different video formats and paths -->
      <source src="Bodymatch.mp4" type="video/mp4" />
      <source src="videos/Bodymatch.mp4" type="video/mp4" />
      <source src="assets/videos/Bodymatch.mp4" type="video/mp4" />
      Your browser does not support the video tag.
    </video>

    <!-- CTA button - HIDDEN until video finishes -->
    <div class="cta-button-wrapper" id="ctaButtonWrapper">
      <a href="https://chat.whatsapp.com/EawwEaGrqvx5t3P5GQUb7E?mode=ac_t" class="cta-button" target="_blank">
        Discover Your Glow
      </a>
    </div>
  </section>

  <script>
    // Get DOM elements
    const video = document.getElementById('heroVideo');
    const ctaButtonWrapper = document.getElementById('ctaButtonWrapper');
    const videoEndedOverlay = document.getElementById('videoEndedOverlay');
    const brandName = document.querySelector('.brand-name');
    
    // Video sources to try
    const videoSources = [
      'Bodymatch.mp4',
      'videos/Bodymatch.mp4',
      'assets/videos/Bodymatch.mp4'
    ];
    
    let currentSourceIndex = 0;
    let videoHasEnded = false;
    let videoLoadedSuccessfully = false;

    // Function to show the CTA button with animation
    function showCTAButton() {
      ctaButtonWrapper.classList.add('show');
      videoEndedOverlay.classList.add('show');
    }

    // Function to try next video source
    function tryNextVideoSource() {
      if (currentSourceIndex < videoSources.length) {
        const source = videoSources[currentSourceIndex];
        
        // Clear existing sources
        video.querySelectorAll('source').forEach(el => el.remove());
        
        // Add new source
        const newSource = document.createElement('source');
        newSource.src = source;
        newSource.type = 'video/mp4';
        video.appendChild(newSource);
        
        // Load the new source
        video.load();
        currentSourceIndex++;
        
        // Try to play
        const playPromise = video.play();
        if (playPromise !== undefined) {
          playPromise
            .then(() => {
              videoLoadedSuccessfully = true;
            })
            .catch(() => {
              setTimeout(tryNextVideoSource, 500);
            });
        }
      }
    }

    // Video event handlers
    video.addEventListener('loadeddata', () => {
      video.classList.add('loaded');
    });

    video.addEventListener('canplay', () => {
      video.classList.add('loaded');
      videoLoadedSuccessfully = true;
    });

    video.addEventListener('error', () => {
      setTimeout(tryNextVideoSource, 500);
    });

    // CRITICAL: When video ends, show CTA button and stay on last frame
    video.addEventListener('ended', () => {
      videoHasEnded = true;
      showCTAButton();
    });

    // Brand name click handler - scroll to top
    brandName.addEventListener('click', (e) => {
      e.preventDefault();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    // Start loading and playing the video
    setTimeout(() => {
      tryNextVideoSource();
    }, 100);

    // Try autoplay on user interaction if blocked
    const attemptPlay = () => {
      if (!videoLoadedSuccessfully && !videoHasEnded) {
        const playPromise = video.play();
        if (playPromise !== undefined) {
          playPromise.catch(() => {
            // Autoplay prevented
          });
        }
      }
    };

    // Try playing on user interaction
    document.addEventListener('click', attemptPlay, { once: true });
    document.addEventListener('touchstart', attemptPlay, { once: true });
  </script>
</body>
</html>
