<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Body Match - Start</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
  
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Space Grotesk', sans-serif;
      background-color: white;
      color: black;
    }

    .video-container {
      width: 100%;
      aspect-ratio: 1280 / 388;
      overflow: hidden;
      background-color: black;
      margin-bottom: 0;
    }

    .video-container video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .content {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px 20px 40px;
      text-align: center;
    }

    .content h2 {
      font-size: 2.5rem;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .content p {
      font-size: 1.1rem;
      font-weight: 400;
      color: #444;
      margin-bottom: 20px;
      line-height: 1.4;
    }

    .button {
      text-decoration: none;
      background-color: black;
      color: white;
      padding: 10px 24px;
      font-size: 1rem;
      border-radius: 4px;
      transition: all 0.3s ease;
      border: 1px solid black;
      cursor: pointer;
    }

    .button:hover {
      background-color: white;
      color: black;
    }

    @media (max-width: 600px) {
      .content h2 {
        font-size: 1.8rem;
      }

      .content p {
        font-size: 1rem;
      }

      .button {
        font-size: 0.95rem;
        padding: 10px 20px;
      }
    }
  </style>
</head>
<body>

<div class="video-container">
  <video autoplay muted loop playsinline>
    <source src="video.mp4" type="video/mp4" />
    Your browser does not support the video tag.
  </video>
</div>

<div class="content">
  <h2>Lets Bodymatch</h2>
  <p>With the right products, you don't just look good, you feel confident and unstoppable.</p>
  <button class="button" onclick="window.location.href='welcome'">Start</button>
</div>

</body>
</html>
