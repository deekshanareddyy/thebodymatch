<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bodymatch - Discover Your Glow</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Space Grotesk', sans-serif;
      background-color: #000;
      color: white;
      overflow-x: hidden;
    }

    /* Hero Section with Video */
    .hero-section {
      position: relative;
      width: 100%;
      height: 100vh; /* Full screen height for impact */
      background-color: #000;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .hero-section video {
      position: absolute;
      top: 50%;
      left: 50%;
      min-width: 100%;
      min-height: 100%;
      width: auto;
      height: auto;
      transform: translate(-50%, -50%);
      object-fit: cover;
      z-index: 1;
    }

    /* Video Overlay for Harmony */
    .video-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.2); /* Subtle dark wash */
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end; /* Push content towards bottom */
      padding-bottom: 15vh; /* Raise button above the bottom edge */
    }

    /* Transparent "Discover Your Glow" Button */
    .glow-button {
      position: relative;
      z-index: 10;
      text-decoration: none;
      background-color: transparent;
      color: white;
      padding: 14px 40px;
      font-size: 1rem;
      font-weight: 500;
      letter-spacing: 2px;
      text-transform: uppercase;
      border: 1px solid rgba(255, 255, 255, 0.8);
      transition: all 0.4s ease;
      cursor: pointer;
      backdrop-filter: blur(5px); /* Adds that premium glass feel */
    }

    .glow-button:hover {
      background-color: white;
      color: black;
      border-color: white;
    }

    /* Organized Sections Below Video */
    .news-section {
      background-color: white;
      color: black;
      padding: 80px 20px;
    }

    .news-container {
      max-width: 800px;
      margin: 0 auto;
    }

    .news-section h2 {
      font-size: 1.5rem;
      letter-spacing: 3px;
      margin-bottom: 50px;
      text-align: center;
      text-transform: uppercase;
    }

    .news-item {
      border-bottom: 1px solid #eee;
      padding: 20px 0;
      transition: opacity 0.3s;
    }

    .news-item:hover { opacity: 0.7; }

    .news-item h3 { font-size: 1.1rem; font-weight: 500; margin-bottom: 10px; }
    
    .news-source {
      display: flex;
      justify-content: space-between;
      color: #888;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Responsive Adjustments */
    @media (max-width: 768px) {
      .hero-section { height: 80vh; } /* Slightly shorter on mobile */
      .glow-button { padding: 12px 30px; font-size: 0.9rem; }
      .video-overlay { padding-bottom: 10vh; }
    }
  </style>
</head>
<body>

<div class="hero-section">
  <video id="heroVideo" autoplay muted loop playsinline poster="fallback-image.jpg">
    <source src="video.mp4" type="video/mp4" id="videoSource">
    Your browser does not support the video tag.
  </video>

  <div class="video-overlay">
    <a href="welcome.html" class="glow-button">Discover Your Glow</a>
  </div>
</div>

<section class="news-section">
  <div class="news-container">
    <h2>TheBodymatch in News</h2>
    
    <div class="news-item">
      <h3>Chennai Startup Reducing Apparel Return Rate With AI</h3>
      <div class="news-source"><span>YourStory</span><span>Apr, 2025</span></div>
    </div>
    
    <div class="news-item">
      <h3>Try This 5-Second Hack to Find Your Signature Scent</h3>
      <div class="news-source"><span>News18</span><span>May, 2025</span></div>
    </div>
    
    <div class="news-item">
      <h3>Quick Perfume Hack: Help Find Signature Scent</h3>
      <div class="news-source"><span>The Indian Express</span><span>May, 2025</span></div>
    </div>
  </div>
</section>

<script>
  const video = document.getElementById('heroVideo');
  const source = document.getElementById('videoSource');

  function setVideoSource() {
    const isMobile = window.innerWidth <= 1024;
    // Ensure 'videoo.mp4' (mobile version) exists and is small for fast loading
    const newSrc = isMobile ? 'videoo.mp4' : 'video.mp4';
    
    if (source.getAttribute('src') !== newSrc) {
      source.setAttribute('src', newSrc);
      video.load();
      // Force play for mobile browsers
      video.play().catch(error => {
        console.log("Autoplay prevented by browser: ", error);
      });
    }
  }

  window.addEventListener('load', setVideoSource);
  window.addEventListener('resize', setVideoSource);
</script>

</body>
</html>
