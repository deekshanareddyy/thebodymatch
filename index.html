<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0"/>
    <title>Bodymatch | The Experience</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }
        html, body { height: 100%; background: #000; color: #fff; font-family: 'Space Grotesk', sans-serif; overflow: hidden; touch-action: none; }

        /* --- LOADER --- */
        .loader-wrapper {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: #000; z-index: 9999; transition: opacity 0.8s ease;
        }
        .loader-wrapper.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        .brand-title-loader { font-weight: 700; letter-spacing: 0.4em; text-transform: uppercase; font-size: 1.2rem; margin-bottom: 50px; }
        .loading-bar-wrapper { width: 180px; height: 1px; background: rgba(255,255,255,0.1); margin-bottom: 12px; }
        .loading-bar-fill { width: 0%; height: 100%; background: #fff; transition: width 0.3s ease; }

        /* --- VIDEO ENGINE --- */
        .hero { position: relative; width: 100%; height: 100vh; background: #000; }
        video { 
            position: absolute; top: 50%; left: 50%; 
            min-width: 100%; min-height: 100%; width: auto; height: auto; 
            transform: translate(-50%, -50%); 
            object-fit: cover; z-index: 1; 
            opacity: 0; visibility: hidden;
            transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        video.active { opacity: 1; visibility: visible; }
        .video-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.15); z-index: 2; }

        /* --- UI ELEMENTS --- */
        .brand-header { position: fixed; top: 0; width: 100%; padding: 25px; display: flex; justify-content: center; z-index: 1000; }
        .brand-name { font-size: 1.1rem; font-weight: 700; letter-spacing: 0.3em; text-transform: uppercase; }
        .audio-toggle { position: absolute; top: 100px; right: 25px; width: 44px; height: 44px; background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 1001; backdrop-filter: blur(10px); }
        .audio-toggle svg { width: 18px; height: 18px; fill: #fff; }
        .hidden-icon { display: none; }

        /* --- NAVIGATION UI --- */
        .cta-container {
            position: absolute; left: 50%; bottom: 6%; transform: translateX(-50%);
            z-index: 1001; text-align: center; width: 100%;
            opacity: 0; visibility: hidden; transition: all 1s ease;
        }
        .cta-container.show { opacity: 1; visibility: visible; }

        .discover-btn {
            display: inline-block; text-decoration: none; background: rgba(255,255,255,0.05); color: #fff;
            padding: 16px 48px; border: 1px solid rgba(255, 255, 255, 0.4); 
            font-weight: 500; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 0.2em; 
            backdrop-filter: blur(15px); margin-bottom: 30px; transition: 0.4s;
        }
        .discover-btn:hover { background: #fff; color: #000; }

        .scroll-hint { font-size: 0.6rem; letter-spacing: 0.4em; text-transform: uppercase; opacity: 0.5; cursor: pointer; }
        .hint-bounce { animation: bounce 2s infinite; }
        @keyframes bounce { 0%, 20%, 50%, 80%, 100% {transform: translateY(0);} 40% {transform: translateY(-5px);} }

        @media (max-width: 768px) {
            .cta-container { bottom: 8%; }
            .discover-btn { width: 85%; font-size: 0.8rem; }
        }
    </style>
</head>
<body>

    <div class="loader-wrapper" id="loader">
        <div class="brand-title-loader">BODYMATCH</div>
        <div class="loading-bar-wrapper"><div class="loading-bar-fill" id="loadingFill"></div></div>
        <div id="loadingPercent">0%</div>
    </div>

    <header class="brand-header"><div class="brand-name">BODYMATCH</div></header>

    <section class="hero">
        <div class="video-overlay"></div>
        <button id="audioToggle" class="audio-toggle">
            <svg id="iconMuted" viewBox="0 0 24 24"><path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73 4.27 3zM12 4L9.91 6.09 12 8.18V4z"/></svg>
            <svg id="iconPlaying" class="hidden-icon" viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
        </button>

        <video id="v0" class="active" autoplay muted playsinline preload="auto"><source src="Bodymatch.mp4" type="video/mp4"></video>
        <video id="v1" muted playsinline preload="auto"><source src="Bodymatchf.mp4" type="video/mp4"></video>
        <video id="v2" muted playsinline preload="auto"><source src="Bodymatchb.mp4" type="video/mp4"></video>
        <video id="v3" muted playsinline preload="auto"><source src="Bodymatchh.mp4" type="video/mp4"></video>
        <video id="v4" muted playsinline preload="auto"><source src="Bodymatchs.mp4" type="video/mp4"></video>
        <video id="v5" muted playsinline preload="auto"><source src="Bodymatchx.mp4" type="video/mp4"></video>

        <div class="cta-container" id="ctaContainer">
            <a href="https://chat.whatsapp.com/EawwEaGrqvx5t3P5GQUb7E" class="discover-btn" target="_blank">Discover Your Glow</a>
            <div class="scroll-hint" id="scrollHint">
                <span id="hintText">Scroll for more</span><br>
                <span class="hint-bounce">▽</span>
            </div>
        </div>
    </section>

    <script>
        const vids = [
            document.getElementById('v0'), document.getElementById('v1'),
            document.getElementById('v2'), document.getElementById('v3'),
            document.getElementById('v4'), document.getElementById('v5')
        ];
        const loader = document.getElementById('loader'), fill = document.getElementById('loadingFill'), label = document.getElementById('loadingPercent');
        const ctaContainer = document.getElementById('ctaContainer'), scrollHint = document.getElementById('scrollHint'), hintText = document.getElementById('hintText');
        const audioBtn = document.getElementById('audioToggle');

        let current = 0;
        let isMoving = false;
        let videoFinished = false;

        // LOADER
        let prog = 0;
        let sim = setInterval(() => { if (prog < 98) { prog += 1.5; fill.style.width = prog + '%'; label.textContent = Math.round(prog) + '%'; } }, 100);

        function init() {
            clearInterval(sim); fill.style.width = '100%'; label.textContent = '100%';
            setTimeout(() => { 
                loader.classList.add('hidden'); 
                vids[0].play();
                // "Warming up" all videos for Edge/Safari
                vids.forEach(v => { v.play().then(() => v.pause()).catch(() => {}); });
            }, 500);
        }
        vids[0].oncanplaythrough = init;
        setTimeout(init, 4000);

        // TRANSITION ENGINE
        function changeVideo(direction) {
            if (isMoving || !videoFinished) return;
            if (direction === 'next' && current === vids.length - 1) return;
            if (direction === 'prev' && current === 0) return;

            isMoving = true;
            videoFinished = false;
            ctaContainer.classList.remove('show');

            const prevVid = vids[current];
            current = (direction === 'next') ? current + 1 : current - 1;
            const nextVid = vids[current];

            nextVid.currentTime = 0;
            nextVid.classList.add('active');
            nextVid.play().then(() => {
                setTimeout(() => {
                    prevVid.classList.remove('active');
                    prevVid.pause();
                    isMoving = false;
                }, 1100);
            });

            // UI Logic for scroll availability
            if (current === 0) {
                scrollHint.style.visibility = 'hidden';
            } else {
                scrollHint.style.visibility = 'visible';
                hintText.textContent = (current === vids.length - 1) ? "Back to top" : "Scroll for more";
            }
        }

        vids.forEach((vid) => {
            vid.onended = () => { 
                videoFinished = true;
                ctaContainer.classList.add('show'); 
            };
        });

        // SCROLL & SWIPE HANDLING
        let lastScroll = 0;
        window.addEventListener('wheel', (e) => {
            const now = Date.now();
            if (now - lastScroll < 1500) return; // Prevent rapid scrolling
            if (e.deltaY > 40) changeVideo('next');
            else if (e.deltaY < -40) changeVideo('prev');
            lastScroll = now;
        });

        let ts = 0;
        window.addEventListener('touchstart', (e) => ts = e.touches[0].clientY);
        window.addEventListener('touchend', (e) => {
            const te = e.changedTouches[0].clientY;
            if (ts - te > 60) changeVideo('next');
            else if (te - ts > 60) changeVideo('prev');
        });

        scrollHint.onclick = () => changeVideo(current === vids.length - 1 ? 'prev' : 'next');

        // AUDIO FIX
        audioBtn.onclick = () => {
            const m = vids[current].muted;
            vids.forEach(v => v.muted = !m);
            document.getElementById('iconMuted').classList.toggle('hidden-icon', m);
            document.getElementById('iconPlaying').classList.toggle('hidden-icon', !m);
            vids[current].play(); // Triggers playback in Edge/Safari
        };
    </script>
</body>
</html>
