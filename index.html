<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bodymatch Loading</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; background: #000; color: #fff; font-family: 'Space Grotesk', sans-serif; }

    .loader-wrapper {
      height: 100vh; width: 100%;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #000; overflow: hidden; position: relative;
    }

    .brand-title {
      font-weight: 700;
      letter-spacing: 0.35em;
      text-transform: uppercase;
      font-size: 1.4rem;
      text-align: center;
      margin-bottom: 60px;
    }

    .energy-symbol {
      width: 140px; height: 140px;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.18);
      display: flex; align-items: center; justify-content: center;
      margin-bottom: 60px; position: relative; overflow: hidden;
    }

    .energy-core {
      width: 60px; height: 60px;
      border-radius: 50%;
      background: radial-gradient(circle, #ffffff 0%, #aaaaaa 40%, #000000 100%);
      animation: pulse 2s ease-in-out infinite;
      box-shadow: 0 0 35px rgba(255,255,255,0.5);
    }

    .energy-ring {
      position: absolute;
      width: 100%; height: 100%;
      border-radius: 50%;
      border: 1px solid rgba(255,255,255,0.12);
      animation: rotate 4s linear infinite;
    }

    .loading-bar-wrapper {
      width: min(420px, 80vw);
      height: 4px;
      background: rgba(255,255,255,0.1);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 16px;
    }

    .loading-bar-fill {
      width: 0; height: 100%;
      background: linear-gradient(90deg, #ffffff, #8a8a8a, #ffffff);
      box-shadow: 0 0 18px rgba(255,255,255,0.7);
      border-radius: inherit;
      transition: width 0.12s ease-out;
    }

    .loading-percent {
      text-align: center;
      font-size: 0.95rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.72);
    }

    .loading-subtext {
      position: absolute;
      bottom: 36px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.75rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.5);
      text-align: center;
      white-space: nowrap;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.9; }
      50% { transform: scale(1.08); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.9; }
    }

    @keyframes rotate {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .fade-out { animation: fadeOut 0.6s ease forwards; }

    @keyframes fadeOut {
      to { opacity: 0; transform: scale(1.02); }
    }

    @media (max-width: 600px) {
      .brand-title {
        font-size: 1.1rem;
        letter-spacing: 0.25em;
        margin-bottom: 40px;
      }
      .energy-symbol { width: 110px; height: 110px; margin-bottom: 40px; }
      .loading-subtext { font-size: 0.7rem; bottom: 28px; }
    }
  </style>
</head>
<body>
  <div class="loader-wrapper" id="loader">
    <div class="brand-title">BODYMATCH</div>

    <div class="energy-symbol">
      <div class="energy-ring"></div>
      <div class="energy-core"></div>
    </div>

    <div class="loading-bar-wrapper">
      <div class="loading-bar-fill" id="loadingFill"></div>
    </div>
    <div class="loading-percent" id="loadingPercent">0%</div>

    <div class="loading-subtext">ENERGY LOADING</div>
  </div>

  <script>
    // Preload critical resources for home.html
    function preloadHomePage() {
      // Create invisible elements to preload
      const preloadElements = [];
      
      // Preload video (if available)
      const video = document.createElement('video');
      video.preload = 'auto';
      video.src = 'Bodymatch.mp4';
      video.style.display = 'none';
      document.body.appendChild(video);
      preloadElements.push(video);
      
      // Preload critical fonts (if any)
      const font = new FontFace('Space Grotesk', 'url(https://fonts.gstatic.com/s/spacegrotesk/v16/V8mDoQDjQSkFtoMM3T6r8E7mPb54C_k.woff2)');
      font.load().then(() => {
        document.fonts.add(font);
      });
      
      return preloadElements;
    }

    // Start preloading immediately
    preloadHomePage();
    
    let progress = 0;
    const fill   = document.getElementById('loadingFill');
    const label  = document.getElementById('loadingPercent');
    const loader = document.getElementById('loader');

    // Simulated loading with real resource checking
    const interval = setInterval(() => {
      if (progress >= 100) {
        clearInterval(interval);
        loader.classList.add('fade-out');
        
        // Add a small delay for better UX
        setTimeout(() => {
          // Redirect to home.html
          window.location.href = 'home.html';
        }, 650);
      } else {
        // More realistic loading simulation
        let increment;
        if (progress < 30) {
          increment = 4; // Fast at start
        } else if (progress < 70) {
          increment = 2; // Slower in middle
        } else if (progress < 85) {
          increment = 1; // Slow near end
        } else {
          increment = 0.5; // Very slow for last bit
        }
        
        progress = Math.min(100, progress + increment);
        fill.style.width = progress + '%';
        label.textContent = Math.round(progress) + '%';
      }
    }, 80);
    
    // If page takes too long to load, force redirect after 5 seconds
    setTimeout(() => {
      if (progress < 100) {
        clearInterval(interval);
        progress = 100;
        fill.style.width = '100%';
        label.textContent = '100%';
        loader.classList.add('fade-out');
        setTimeout(() => {
          window.location.href = 'home.html';
        }, 650);
      }
    }, 5000);
  </script>
</body>
</html>
