<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bodymatch - Discover Your Glow</title>

  <!-- Space Grotesk font -->
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
      background: #000;
    }

    body {
      font-family: 'Space Grotesk', sans-serif;
      background-color: #000;
      color: #fff;
      opacity: 0;
      animation: fadeIn 0.8s ease forwards;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    /* Top Brand Header - Always visible */
    .brand-header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 20px 30px;
      z-index: 100;
      background: rgba(0, 0, 0, 0.9);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-name {
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #fff;
      text-decoration: none;
    }

    /* Hero: full-viewport background video + CTA */
    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background-color: #000;
    }

    .hero video {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100%;
      height: 100%;
      transform: translate(-50%, -50%);
      object-fit: cover;
      opacity: 0;
      transition: opacity 1s ease;
      z-index: 1;
    }

    .hero video.loaded {
      opacity: 1;
    }

    /* Video overlay for better contrast */
    .video-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.2);
      z-index: 2;
      pointer-events: none;
    }

    /* CTA button at lower center - HIDDEN by default */
    .cta-button-wrapper {
      position: absolute;
      left: 50%;
      bottom: 15%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 4;
      padding: 0 20px;
      width: 100%;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    .cta-button-wrapper.show {
      opacity: 1;
      visibility: visible;
    }

    .cta-button {
      text-decoration: none;
      background-color: #000;
      color: #fff;
      padding: 18px 46px;
      font-size: 1.3rem;
      border-radius: 4px;
      transition: all 0.3s ease;
      border: 1px solid #fff;
      cursor: pointer;
      display: inline-block;
      font-weight: 600;
      letter-spacing: 0.5px;
      white-space: nowrap;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      position: relative;
      overflow: hidden;
      transform: translateY(20px);
      transition: all 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .cta-button-wrapper.show .cta-button {
      transform: translateY(0);
    }

    .cta-button::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
      transition: left 0.7s ease;
    }

    .cta-button:hover {
      background-color: #fff;
      color: #000;
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
    }

    .cta-button:hover::before {
      left: 100%;
    }

    /* Video ended overlay */
    .video-ended-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(to bottom, rgba(0,0,0,0.1), rgba(0,0,0,0.3));
      z-index: 2;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .video-ended-overlay.show {
      opacity: 1;
    }

    /* Loading indicator for mobile */
    .loading-indicator {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 5;
      color: white;
      font-size: 1rem;
      opacity: 0.8;
      display: none;
    }

    .loading-indicator.show {
      display: block;
    }

    /* Tablet and up */
    @media (min-width: 768px) {
      .brand-header {
        padding: 22px 40px;
      }

      .brand-name {
        font-size: 1.4rem;
        letter-spacing: 0.3em;
      }

      .cta-button {
        font-size: 1.4rem;
        padding: 20px 50px;
      }

      .cta-button-wrapper {
        bottom: 15%;
      }
    }

    /* Small screens */
    @media (max-width: 600px) {
      .brand-header {
        padding: 16px 20px;
      }

      .brand-name {
        font-size: 1.1rem;
        letter-spacing: 0.2em;
      }

      .cta-button {
        font-size: 1.1rem;
        padding: 16px 32px;
      }

      .cta-button-wrapper {
        bottom: 12%;
      }

      .hero {
        height: calc(100vh - 60px);
        margin-top: 60px;
      }
    }

    /* Very small devices */
    @media (max-width: 380px) {
      .brand-header {
        padding: 14px 15px;
      }

      .brand-name {
        font-size: 1rem;
        letter-spacing: 0.15em;
      }

      .cta-button-wrapper {
        bottom: 10%;
      }

      .cta-button {
        width: 100%;
        max-width: 260px;
        padding: 14px 24px;
        font-size: 1rem;
      }
    }
  </style>
</head>
<body>
  <!-- Top Brand Header - Always visible -->
  <header class="brand-header">
    <div class="brand-name">BODYMATCH</div>
  </header>

  <!-- Loading indicator for mobile -->
  <div class="loading-indicator" id="loadingIndicator">
    Loading experience...
  </div>

  <!-- Hero with background video and CTA -->
  <section class="hero">
    <!-- Video overlay -->
    <div class="video-overlay"></div>
    <div class="video-ended-overlay" id="videoEndedOverlay"></div>
    
    <!-- Video element - will play only once and stop at end -->
    <video
      id="heroVideo"
      autoplay
      muted
      playsinline
      preload="auto"
      title="Bodymatch fragrance film">
      <!-- Multiple source formats for better compatibility -->
      <source src="Bodymatch.mp4" type="video/mp4">
      <source src="Bodymatch.webm" type="video/webm">
      Your browser does not support the video tag.
    </video>

    <!-- CTA button - HIDDEN until video finishes -->
    <div class="cta-button-wrapper" id="ctaButtonWrapper">
      <a href="https://chat.whatsapp.com/EawwEaGrqvx5t3P5GQUb7E?mode=ac_t" class="cta-button" target="_blank">
        Discover Your Glow
      </a>
    </div>
  </section>

  <script>
    // Get DOM elements
    const video = document.getElementById('heroVideo');
    const ctaButtonWrapper = document.getElementById('ctaButtonWrapper');
    const videoEndedOverlay = document.getElementById('videoEndedOverlay');
    const loadingIndicator = document.getElementById('loadingIndicator');
    
    let videoHasEnded = false;
    let videoLoadedSuccessfully = false;

    // Function to show the CTA button with animation
    function showCTAButton() {
      ctaButtonWrapper.classList.add('show');
      videoEndedOverlay.classList.add('show');
    }

    // Function to handle mobile video loading
    function loadVideoForMobile() {
      // Show loading indicator for mobile
      if (window.innerWidth <= 768) {
        loadingIndicator.classList.add('show');
      }
      
      // Set video source
      video.src = 'Bodymatch.mp4';
      video.load();
      
      // Try to play the video
      const playPromise = video.play();
      
      if (playPromise !== undefined) {
        playPromise
          .then(() => {
            // Video started playing
            videoLoadedSuccessfully = true;
            loadingIndicator.classList.remove('show');
          })
          .catch((error) => {
            // Autoplay was prevented - common on mobile
            console.log('Autoplay prevented:', error);
            
            // For mobile, we'll show the video with a play button overlay
            if (window.innerWidth <= 768) {
              // Create a play overlay for mobile
              createMobilePlayOverlay();
            }
          });
      }
    }

    // Create mobile play overlay for when autoplay is blocked
    function createMobilePlayOverlay() {
      const playOverlay = document.createElement('div');
      playOverlay.style.position = 'absolute';
      playOverlay.style.top = '50%';
      playOverlay.style.left = '50%';
      playOverlay.style.transform = 'translate(-50%, -50%)';
      playOverlay.style.zIndex = '10';
      playOverlay.style.background = 'rgba(0,0,0,0.7)';
      playOverlay.style.padding = '20px 30px';
      playOverlay.style.borderRadius = '8px';
      playOverlay.style.color = 'white';
      playOverlay.style.textAlign = 'center';
      playOverlay.style.cursor = 'pointer';
      playOverlay.innerHTML = `
        <div style="font-size: 1.2rem; margin-bottom: 10px;">▶ Play Video</div>
        <div style="font-size: 0.9rem; opacity: 0.8;">Tap to start the experience</div>
      `;
      
      playOverlay.addEventListener('click', () => {
        video.play()
          .then(() => {
            playOverlay.style.display = 'none';
            videoLoadedSuccessfully = true;
          })
          .catch(err => {
            console.log('Still cannot play:', err);
          });
      });
      
      document.querySelector('.hero').appendChild(playOverlay);
    }

    // Video event handlers
    video.addEventListener('loadeddata', () => {
      console.log('Video loaded successfully');
      video.classList.add('loaded');
      loadingIndicator.classList.remove('show');
    });

    video.addEventListener('canplay', () => {
      console.log('Video can play');
      video.classList.add('loaded');
      videoLoadedSuccessfully = true;
    });

    video.addEventListener('error', (e) => {
      console.log('Video error:', e);
      loadingIndicator.classList.remove('show');
      
      // Try alternative video sources
      const videoSources = [
        'videos/Bodymatch.mp4',
        'assets/Bodymatch.mp4',
        'assets/videos/Bodymatch.mp4',
        'https://assets.mixkit.co/videos/preview/mixkit-a-woman-spraying-perfume-on-her-neck-3986-large.mp4' // Fallback video
      ];
      
      // Try to load fallback video
      if (video.error && video.error.code === 4) {
        // Try to load a fallback video
        video.src = videoSources[3]; // Use external fallback
        video.load();
        video.play().catch(() => {
          // If all fails, show CTA immediately
          showCTAButton();
        });
      }
    });

    // CRITICAL: When video ends, show CTA button and stay on last frame
    video.addEventListener('ended', () => {
      console.log('Video ended');
      videoHasEnded = true;
      video.currentTime = video.duration; // Ensure it stays on last frame
      video.pause(); // Pause on last frame
      showCTAButton();
    });

    // Start loading the video
    window.addEventListener('DOMContentLoaded', () => {
      // Small delay to ensure everything is ready
      setTimeout(() => {
        loadVideoForMobile();
      }, 300);
    });

    // For iOS/Safari mobile - special handling
    document.addEventListener('touchstart', () => {
      if (!videoLoadedSuccessfully && !videoHasEnded) {
        const playPromise = video.play();
        if (playPromise !== undefined) {
          playPromise.catch(() => {
            // Autoplay prevented on iOS
            createMobilePlayOverlay();
          });
        }
      }
    }, { once: true });

    // Also try on regular click for other devices
    document.addEventListener('click', () => {
      if (!videoLoadedSuccessfully && !videoHasEnded) {
        const playPromise = video.play();
        if (playPromise !== undefined) {
          playPromise.catch(() => {
            // Autoplay prevented
          });
        }
      }
    }, { once: true });

    // Fallback: If video doesn't load after 3 seconds on mobile, show CTA
    setTimeout(() => {
      if (!videoLoadedSuccessfully && !videoHasEnded && window.innerWidth <= 768) {
        console.log('Mobile video loading timeout - showing CTA');
        loadingIndicator.classList.remove('show');
        showCTAButton();
      }
    }, 3000);
  </script>
</body>
</html>
