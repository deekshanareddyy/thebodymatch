<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bodymatch - Discover Your Glow</title>

  <!-- Space Grotesk font -->
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      font-family: 'Space Grotesk', sans-serif;
      background-color: #000;
      color: #fff;
      display: flex;
      flex-direction: column;
    }

    /* Hero: full-viewport background video + CTA */
    .hero {
      position: relative;
      width: 100%;
      height: auto;              /* height controlled by aspect-ratio */
      aspect-ratio: 21 / 9;      /* 21:9 hero area */
      overflow: hidden;
      flex-shrink: 0;
      background-color: #000;
    }

    .hero video {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100%;               /* fill hero width */
      height: 100%;              /* fill hero height */
      transform: translate(-50%, -50%);
      object-fit: cover;         /* clean, even crop */
    }

    /* On tall screens, let it behave like full viewport height */
    @media (max-aspect-ratio: 21/9) {
      .hero {
        height: 100vh;
        aspect-ratio: auto;
      }
    }

    /* CTA button at lower center */
    .cta-button-wrapper {
      position: absolute;
      left: 50%;
      bottom: 12%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 2;
      padding: 0 20px;
    }

    .cta-button {
      text-decoration: none;
      background-color: #000;
      color: #fff;
      padding: 16px 40px;
      font-size: 1.3rem;
      border-radius: 4px;
      transition: all 0.3s ease;
      border: 1px solid #fff;
      cursor: pointer;
      display: inline-block;
      font-weight: 600;
      letter-spacing: 0.5px;
      white-space: nowrap;
    }

    .cta-button:hover {
      background-color: #fff;
      color: #000;
    }

    /* Footer wrapper so it sits below hero */
    .page-footer-wrapper {
      flex-shrink: 0;
      background-color: #111;
    }

    /* Footer styles */
    .footer {
      background-color: #111;
      color: #fff;
      padding: 24px 20px 28px;
      text-align: center;
      font-family: 'Space Grotesk', sans-serif;
      opacity: 0;
      transform: translateY(30px);
      transition: opacity 0.6s ease-out, transform 0.6s ease-out;
    }

    .footer.show {
      opacity: 1;
      transform: translateY(0);
    }

    .footer-content {
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 8px;
    }

    .footer-left {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .footer-text {
      font-size: 1rem;
      font-weight: 400;
    }

    .footer-name {
      font-size: 1.1rem;
      font-weight: 600;
    }

    .footer .heart {
      color: #e25555;
      font-size: 1.2rem;
    }

    .social-links {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 6px;
    }

    .icon {
      width: 24px;
      height: 24px;
      transition: transform 0.3s ease;
    }

    .instagram {
      filter: invert(30%) sepia(76%) saturate(750%) hue-rotate(310deg) brightness(90%) contrast(105%);
    }

    .linkedin {
      filter: invert(34%) sepia(64%) saturate(1797%) hue-rotate(182deg) brightness(90%) contrast(95%);
    }

    .youtube {
      filter: invert(18%) sepia(99%) saturate(6400%) hue-rotate(359deg) brightness(95%) contrast(95%);
    }

    .social-links a:hover img {
      transform: scale(1.15);
    }

    /* Tablet and up */
    @media (min-width: 768px) {
      .cta-button {
        font-size: 1.4rem;
        padding: 18px 46px;
      }

      .cta-button-wrapper {
        bottom: 15%; /* slightly higher for nicer balance on large screens */
      }

      .footer-content {
        flex-direction: row;
        justify-content: space-between;
        align-items: center;
        text-align: left;
      }

      .footer-left {
        align-items: flex-start;
      }

      .footer-name {
        font-size: 1.15rem;
      }
    }

    /* Small screens */
    @media (max-width: 600px) {
      .cta-button-wrapper {
        bottom: 10%;
      }

      .cta-button {
        font-size: 1.1rem;
        padding: 14px 28px;
        white-space: normal; /* allow wrapping if needed */
      }

      .footer-text,
      .footer-name {
        font-size: 0.95rem;
        text-align: center;
      }

      .social-links {
        gap: 16px;
      }

      .icon {
        width: 22px;
        height: 22px;
      }
    }

    /* Very small devices */
    @media (max-width: 380px) {
      .cta-button-wrapper {
        bottom: 9%;
      }

      .cta-button {
        width: 100%;
        max-width: 260px;
      }
    }
  </style>
</head>
<body>
  <!-- Hero with background video and CTA -->
  <section class="hero">
    <video
      id="heroVideo"
      autoplay
      muted
      playsinline
      preload="auto"
      title="Bodymatch fragrance film">
      <source src="Bodymatch.mp4" type="video/mp4" />
      Your browser does not support the video tag.
    </video>

    <div class="cta-button-wrapper">
      <a href="https://chat.whatsapp.com/EawwEaGrqvx5t3P5GQUb7E?mode=ac_t" class="cta-button">
        Discover Your Glow
      </a>
    </div>
  </section>

  <!-- Footer -->
  <div class="page-footer-wrapper">
    <footer class="footer">
      <div class="footer-content">
        <div class="footer-left">
          <p class="footer-text">Made with <span class="heart">♡</span> by Fashion Designer Dee</p>
          <p class="footer-name">Deekshana Reddy</p>
        </div>
        <div class="social-links">
          <a href="https://www.instagram.com/fashiondesignerdee/" target="_blank" aria-label="Instagram" title="Instagram">
            <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/instagram.svg" alt="Instagram" class="icon instagram" />
          </a>
          <a href="https://www.linkedin.com/in/deekshana-reddy-%F0%9F%94%B1-966b461a4/" target="_blank" aria-label="LinkedIn" title="LinkedIn">
            <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/linkedin.svg" alt="LinkedIn" class="icon linkedin" />
          </a>
          <a href="https://www.youtube.com/@Deekshanareddy" target="_blank" aria-label="YouTube" title="YouTube">
            <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/youtube.svg" alt="YouTube" class="icon youtube" />
          </a>
        </div>
      </div>
    </footer>
  </div>

  <script>
    // Play once only: when video ends, stop and stay on the last frame
    const video = document.getElementById('heroVideo');
    if (video) {
      video.addEventListener('ended', () => {
        video.pause(); // keep final frame visible
      });

      // Try to autoplay; if blocked (some mobiles), enable controls as fallback
      const attemptPlay = () => {
        const p = video.play();
        if (p !== undefined) {
          p.catch(() => {
            video.setAttribute('controls', 'controls');
          });
        }
      };

      attemptPlay();
      window.addEventListener('touchstart', attemptPlay, { once: true });
      window.addEventListener('click', attemptPlay, { once: true });
    }

    // Footer animation when it scrolls into view
    window.addEventListener('DOMContentLoaded', () => {
      const footer = document.querySelector('.footer');
      if (!footer) return;

      const observer = new IntersectionObserver(
        ([entry]) => {
          if (entry.isIntersecting) {
            footer.classList.add('show');
            observer.unobserve(footer);
          }
        },
        { threshold: 0.1 }
      );

      observer.observe(footer);
    });
  </script>
</body>
</html>
