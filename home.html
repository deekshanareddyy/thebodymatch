<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Bodymatch</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      background: #000;
      color: #fff;
      font-family: 'Space Grotesk', sans-serif;
    }

    /* Fixed Header */
    .brand-header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      padding: 20px 30px;
      background: rgba(0, 0, 0, 0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .brand-name {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: #fff;
      text-decoration: none;
    }

    /* Hero Section */
    .hero {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      background-color: #000;
    }

    .hero video {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 100%;
      height: 100%;
      transform: translate(-50%, -50%);
      object-fit: cover;
      opacity: 0;
      transition: opacity 1s ease;
      z-index: 1;
    }

    .hero video.loaded {
      opacity: 1;
    }

    .video-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.3);
      z-index: 2;
    }

    /* CTA Button */
    .cta-button-wrapper {
      position: absolute;
      left: 50%;
      bottom: 10%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 3;
      padding: 0 20px;
      width: 100%;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.8s ease, visibility 0.8s ease;
    }

    .cta-button-wrapper.show {
      opacity: 1;
      visibility: visible;
    }

    .cta-button {
      text-decoration: none;
      background-color: #000;
      color: #fff;
      padding: 18px 46px;
      font-size: 1.3rem;
      border-radius: 4px;
      border: 1px solid #fff;
      transition: all 0.3s ease;
      cursor: pointer;
      font-weight: 600;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      display: inline-block;
      white-space: nowrap;
      transform: translateY(20px);
      transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .cta-button-wrapper.show .cta-button {
      transform: translateY(0);
    }

    .cta-button:hover {
      background-color: #fff;
      color: #000;
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.5);
    }

    /* Video Ended Overlay */
    .video-ended-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(to bottom, rgba(0, 0, 0, 0.1), rgba(0, 0, 0, 0.3));
      z-index: 2;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    .video-ended-overlay.show {
      opacity: 1;
    }

    /* Responsive Design for Smaller Screens */
    @media (max-width: 768px) {
      .brand-name {
        font-size: 1.2rem;
      }

      .cta-button {
        padding: 15px 35px;
        font-size: 1.1rem;
      }

      .cta-button-wrapper {
        bottom: 8%;
      }
    }

    @media (max-width: 480px) {
      .cta-button {
        padding: 12px 30px;
        font-size: 1rem;
      }

      .cta-button-wrapper {
        bottom: 6%;
      }
    }
  </style>
</head>

<body>
  <!-- Top Fixed Header -->
  <header class="brand-header">
    <div class="brand-name">BODYMATCH</div>
  </header>

  <!-- Hero Section -->
  <section class="hero">
    <!-- Video overlay for contrast -->
    <div class="video-overlay"></div>

    <!-- Video Element with Muted Attribute -->
    <video id="heroVideo" autoplay muted playsinline preload="auto">
      <source src="Bodymatch.mp4" type="video/mp4">
      <source src="Bodymatch.webm" type="video/webm">
      Your browser does not support the video tag.
    </video>

    <!-- Overlay that shows after video ends -->
    <div class="video-ended-overlay" id="videoEndedOverlay"></div>

    <!-- CTA Button - Initially Hidden -->
    <div class="cta-button-wrapper" id="ctaButtonWrapper">
      <a href="https://chat.whatsapp.com/EawwEaGrqvx5t3P5GQUb7E?mode=ac_t" class="cta-button" target="_blank">
        Discover Your Glow
      </a>
    </div>
  </section>

  <script>
    // Get the video and CTA button elements
    const video = document.getElementById('heroVideo');
    const ctaButtonWrapper = document.getElementById('ctaButtonWrapper');
    const videoEndedOverlay = document.getElementById('videoEndedOverlay');

    // Show CTA Button when the video ends
    function showCTAButton() {
      ctaButtonWrapper.classList.add('show');
      videoEndedOverlay.classList.add('show');
    }

    // Video event listeners
    video.addEventListener('loadeddata', () => {
      console.log('Video loaded successfully');
      video.classList.add('loaded');
    });

    video.addEventListener('canplay', () => {
      console.log('Video can play');
      video.classList.add('loaded');
    });

    video.addEventListener('ended', () => {
      console.log('Video ended');
      video.currentTime = video.duration; // Ensure it stays on last frame
      video.pause(); // Pause video at the last frame
      showCTAButton(); // Show the CTA button after the video ends
    });

    // Autoplay video on page load
    window.addEventListener('DOMContentLoaded', () => {
      const playPromise = video.play();
      if (playPromise !== undefined) {
        playPromise
          .then(() => {
            console.log('Video started playing automatically');
          })
          .catch((error) => {
            console.log('Autoplay blocked:', error);
          });
      }
    });
  </script>
</body>
</html>
